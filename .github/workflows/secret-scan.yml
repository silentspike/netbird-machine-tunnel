name: Secret Scan

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || github.actor_id }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Install Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: Run secret scan
        run: gitleaks detect --source . --no-git --verbose --redact

      - name: Scan incoming commits
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$BEFORE" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$HEAD_SHA^{commit}"
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$HEAD_SHA"
          elif [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            echo "Unable to resolve the pull request base commit." >&2
            exit 1
          elif [[ "$BEFORE" != 0000000000000000000000000000000000000000 ]] &&
               timeout 45s git fetch --quiet --no-tags --no-write-fetch-head origin "$BEFORE" 2>/dev/null &&
               git cat-file -e "$BEFORE^{commit}"; then
            range="$BEFORE..$HEAD_SHA"
          else
            # The previous tip can be missing on an initial push or a history rewrite.
            echo "Previous push tip unavailable. Scanning the complete head history."
            range="$HEAD_SHA"
          fi
          gitleaks git --no-banner --redact=100 --log-opts="--diff-merges=first-parent $range" .
          python3 .github/scripts/scan-windows-answer-files.py "$range"
